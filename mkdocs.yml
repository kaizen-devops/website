site_name: kaizendevops
theme:
  logo: images/tux.png
  name: material
  features:
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - toc.integrate
    - toc.follow
    - navigation.path
    - navigation.top
    - navigation.left
    - search.suggest
    - search.highlight
    - content.tabs.link
    - content.code.annotation
    - content.code.copy
    - content.code.select
    - content.code.annotation
  language: en
  palette:
    - scheme: default
      toggle:
        icon: material/weather-sunny
        name: Switch to Dark Mode
      primary: custom
      accent: blue
    - scheme: slate
      toggle:
        icon: material/weather-night
        name: Switch to Light Mode
      primary: custom
      accent: blue
  icon:
    admonition:
      note: octicons/tag-16
      abstract: octicons/checklist-16
      info: octicons/info-16
      tip: octicons/squirrel-16
      success: octicons/check-16
      question: octicons/question-16
      warning: octicons/alert-16
      failure: octicons/x-circle-16
      danger: octicons/zap-16
      bug: octicons/bug-16
      example: octicons/beaker-16
      quote: octicons/quote-16

extra:
  social:
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/renehoos/
      name: LinkedIn
    - icon: fontawesome/solid/envelope
      link: mailto:kaizendevops@pm.me
      name: Email

plugins:
  - search
  - i18n:
      docs_structure: suffix
      languages:
        - locale: en
          name: English
          build: true
          default: true
        - locale: nl
          name: Nederlands
          build: true
          copyright: |
            &copy; 2025–2026 <a href="https://kaizendevops.com" target="_blank" rel="noopener">kaizendevops</a>. Alle rechten voorbehouden. KVK: 12345678
          nav_translations:
            Welcome: Welkom
            Persona: Persona
            Greetings: Kennismaking
            Approach: Aanpak
            Work ethics: Werkethiek
            Contact: Contact
  - privacy:
      links_attr_map:
        target: _blank
  - macros
  - mkdocs-video:
      is_video: True
      video_muted: True
      video_controls: True
      video_type: mp4
      css_style:
        width: "50%"

extra_css:
  - stylesheets/extra.css

copyright: |
  &copy; 2025–2026 <a href="https://kaizendevops.com" target="_blank" rel="noopener">kaizendevops</a>. All rights reserved. KVK: 12345678 #todo get a real kvk number

nav:
  - Welcome: index.md
  - Persona:
      - Greetings: content/persona/who_am_i.md
  - Approach:
      - Work ethics: content/approach/way_of_working.md
  - Contact: content/contact/contact.md
markdown_extensions:
  - attr_list
  - admonition
  - def_list
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
